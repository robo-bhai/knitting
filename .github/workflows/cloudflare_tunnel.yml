name: Run GarmentFlow Server & Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: "Server Run Duration in Hours (Max 5.8 hours due to GitHub limit)"
        required: true
        default: "5"
  # Optional: un-comment to automatically trigger on push
  # push:
  #   branches: [ main ]

permissions:
  actions: write
  contents: write

jobs:
  run-server-and-tunnel:
    name: Run Application, GitHub MySQL & Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub maximum limit is 360 minutes (6 hours)

    # 1. Native GitHub Actions MySQL Service Container
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: garmentflow_pro
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      PORT: 5000
      SECRET_KEY: ${{ secrets.SECRET_KEY || 'production-secret-garmentflow-erp-token-9928' }}
      # GitHub Actions Native MySQL connection settings
      DB_TYPE: "mysql"
      MYSQL_HOST: "127.0.0.1"
      MYSQL_PORT: "3306"
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root"
      MYSQL_DB: "garmentflow_pro"
      # Admin credentials loaded from GitHub Secrets
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME || 'admin' }}
      ADMIN_PASSWORDS: ${{ secrets.ADMIN_PASSWORDS || secrets.ADMIN_PASSWORD || 'admin123' }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: ⏳ Wait for Previous Workflow Run to Complete & Save Cache
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR_RUN_ID: ${{ github.run_id }}
          CUR_RUN_NUMBER: ${{ github.run_number }}
          CUR_REPOSITORY: ${{ github.repository }}
        run: |
          echo "=========================================================="
          echo "🔍 CHECKING FOR ACTIVE PREVIOUS WORKFLOW RUNS            "
          echo "=========================================================="
          python3 -c '
          import os, sys, time, json, urllib.request

          repo = os.environ.get("CUR_REPOSITORY") or os.environ.get("GITHUB_REPOSITORY", "")
          token = os.environ.get("GITHUB_TOKEN", "")
          cur_id = int(os.environ.get("CUR_RUN_ID") or os.environ.get("GITHUB_RUN_ID", "0"))
          cur_num = int(os.environ.get("CUR_RUN_NUMBER") or os.environ.get("GITHUB_RUN_NUMBER", "0"))

          if not token or not repo:
              print("ℹ️ GITHUB_TOKEN not available; skipping previous run wait check.")
              sys.exit(0)

          max_wait = 180 # Up to 3 minutes
          poll_interval = 6
          elapsed = 0
          signaled_runs = set()

          print(f"Current Run ID: {cur_id} (Run #{cur_num})")
          print("Checking if an earlier workflow run is actively running and saving database cache...")

          while elapsed < max_wait:
              try:
                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/actions/runs?per_page=30",
                      headers={
                          "Authorization": f"Bearer {token}",
                          "Accept": "application/vnd.github.v3+json",
                          "User-Agent": "GarmentFlow-Coordinator"
                      }
                  )
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode())
                      runs = data.get("workflow_runs", [])
                      active_statuses = ("in_progress", "queued", "waiting", "pending", "requested")
                      
                      # Active older runs
                      active_prev = [
                          r for r in runs 
                          if r.get("status") in active_statuses
                          and r.get("id") != cur_id 
                          and (r.get("id", 0) < cur_id or r.get("run_number", 0) < cur_num)
                      ]

                      if not active_prev:
                          print("✅ No active previous workflow runs detected. Cache is fully saved and safe to restore!")
                          sys.exit(0)

                      # Give previous run 45s to detect the new run and push its DB snapshot gracefully
                      if elapsed >= 45:
                          for r in active_prev:
                              pid = r.get("id")
                              st = r.get("status", "")
                              if pid and pid not in signaled_runs:
                                  print(f"📢 Sending fallback signal to previous active run #{pid} (status: {st})...")
                                  try:
                                      cancel_req = urllib.request.Request(
                                          f"https://api.github.com/repos/{repo}/actions/runs/{pid}/cancel",
                                          method="POST",
                                          headers={
                                              "Authorization": f"Bearer {token}",
                                              "Accept": "application/vnd.github.v3+json",
                                              "User-Agent": "GarmentFlow-Coordinator"
                                          }
                                      )
                                      with urllib.request.urlopen(cancel_req, timeout=10) as c_resp:
                                          print(f"✅ Signal delivered to run #{pid} (HTTP {c_resp.status}).")
                                  except Exception as ce:
                                      print(f"ℹ️ Note on signal for run #{pid}: {ce}")
                                  signaled_runs.add(pid)

                      prev_ids = [str(r["id"]) for r in active_prev]
                      print(f"⏳ Previous run(s) active: {prev_ids}. Waiting for safe database snapshot ({elapsed}s / {max_wait}s)...")
              except Exception as e:
                  print(f"⚠️ Warning during check: {e}")

              time.sleep(poll_interval)
              elapsed += poll_interval

          print("⚠️ Wait timeout reached. Proceeding with cache restore.")
          '

      - name: 📦 Install Python Dependencies & MySQL Client
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install Flask gunicorn xlsxwriter python-dotenv werkzeug PyMySQL mysql-connector-python cryptography
          fi

      - name: 🔄 Restore MySQL Cache from Actions Cache
        id: mysql-cache
        uses: actions/cache/restore@v4
        with:
          path: db_backup
          key: garmentflow-mysql-${{ github.run_number }}-${{ github.run_attempt }}
          restore-keys: |
            garmentflow-mysql-

      - name: 📥 Restore Persistent Database (Git 'db-storage' & Actions Cache)
        run: |
          mkdir -p db_backup
          echo "=========================================================="
          echo "       RESTORING MYSQL DATA FROM PERSISTENT STORAGE       "
          echo "=========================================================="
          
          # 1. Fetch persistent database from Git 'db-storage' branch
          echo "Checking Git 'db-storage' branch..."
          git fetch origin db-storage:refs/remotes/origin/db-storage 2>/dev/null || true
          if git cat-file -e origin/db-storage:db_backup/garmentflow_pro.sql 2>/dev/null; then
            git show origin/db-storage:db_backup/garmentflow_pro.sql > db_backup/garmentflow_pro.git.sql
            echo "📦 Found Git persistent backup ($(du -h db_backup/garmentflow_pro.git.sql | cut -f1))"
          fi
          
          # 2. Compare Git backup with Actions Cache backup, pick the most complete one
          if [ -f db_backup/garmentflow_pro.git.sql ] && [ -s db_backup/garmentflow_pro.git.sql ]; then
            GIT_SIZE=$(wc -c < db_backup/garmentflow_pro.git.sql 2>/dev/null || echo 0)
            CACHE_SIZE=0
            if [ -f db_backup/garmentflow_pro.sql ] && [ -s db_backup/garmentflow_pro.sql ]; then
              CACHE_SIZE=$(wc -c < db_backup/garmentflow_pro.sql 2>/dev/null || echo 0)
            fi
            
            if [ "$GIT_SIZE" -ge "$CACHE_SIZE" ]; then
              echo "✅ Selecting Git persistent database backup ($GIT_SIZE bytes)..."
              cp db_backup/garmentflow_pro.git.sql db_backup/garmentflow_pro.sql
            else
              echo "✅ Selecting Actions Cache database backup ($CACHE_SIZE bytes)..."
            fi
          fi
          
          # 3. Import into MySQL container
          if [ -f db_backup/garmentflow_pro.sql ] && [ -s db_backup/garmentflow_pro.sql ]; then
            echo "Importing database dump into GitHub Actions MySQL service..."
            mysql -h 127.0.0.1 -P 3306 -u root -proot garmentflow_pro < db_backup/garmentflow_pro.sql
            echo "✅ Database restored successfully! All tables and data restored."
          else
            echo "ℹ️ No existing database dump found. Fresh MySQL database instance will be initialized."
          fi

      - name: 🛠️ Verify & Auto-Recreate Tables and Migrations
        run: |
          echo "=========================================================="
          echo "⚙️ CHECKING & AUTO-CREATING ALL TABLES & COLUMNS          "
          echo "=========================================================="
          python3 -c "
          import os, sys
          os.environ['DB_TYPE'] = 'mysql'
          os.environ['MYSQL_HOST'] = '127.0.0.1'
          os.environ['MYSQL_PORT'] = '3306'
          os.environ['MYSQL_USER'] = 'root'
          os.environ['MYSQL_PASSWORD'] = 'root'
          os.environ['MYSQL_DB'] = 'garmentflow_pro'

          import main
          print('[DB] Checking connection and executing repair_and_migrate_db()...')
          main.repair_and_migrate_db()
          print('✅ All 16 ERP tables and missing columns verified, repaired, and ready!')
          "

      - name: 🛡️ Install Cloudflare Tunnel CLI (cloudflared)
        run: |
          echo "Installing latest cloudflared client..."
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm cloudflared.deb
          cloudflared --version

      - name: 🗄️ Verify Application Files
        run: |
          echo "Checking application files..."
          if [ -f main.py ]; then
            echo "✅ Found main.py in repository root."
          elif [ -f public/assets/aistudio/main_db7d8a2c.py ]; then
            echo "Copying main_db7d8a2c.py to main.py..."
            cp public/assets/aistudio/main_db7d8a2c.py main.py
          fi

      - name: 🚀 Start Flask Web Server
        run: |
          echo "Starting GarmentFlow Backend Server with GitHub Actions MySQL on 127.0.0.1:${PORT}..."
          
          # Start gunicorn in background
          gunicorn --workers 3 --bind 127.0.0.1:5000 main:app --daemon --access-logfile - --error-logfile -
          
          # Health check: Wait until server responds
          echo "Waiting for web server to initialize..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/login | grep -qE "200|302"; then
              echo "✅ Web server is UP and responding on port 5000!"
              break
            fi
            echo "Attempt $i: Server starting, waiting 1s..."
            sleep 1
          done

      - name: 🌐 Connect & Run Cloudflare Tunnel (Token Only)
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          echo "=========================================================="
          echo "     CONNECTING CLOUDFLARE TUNNEL VIA SECRET TOKEN        "
          echo "=========================================================="
          
          if [ -z "$CLOUDFLARE_TUNNEL_TOKEN" ]; then
            echo "❌ ERROR: 'CLOUDFLARE_TUNNEL_TOKEN' secret is missing in GitHub Repository Secrets!"
            echo "Please add it in: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "Launching fallback TryCloudflare temporary tunnel so your job still connects..."
            nohup cloudflared tunnel --url http://127.0.0.1:5000 > tunnel.log 2>&1 &
            sleep 5
            grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]*\.trycloudflare.com' tunnel.log || true
          else
            echo "✅ Loaded CLOUDFLARE_TUNNEL_TOKEN from GitHub Secrets."
            echo "Starting cloudflared tunnel..."
            nohup cloudflared tunnel --no-autoupdate run --token "$CLOUDFLARE_TUNNEL_TOKEN" > tunnel.log 2>&1 &
            TUNNEL_PID=$!
            echo "Cloudflared Process ID: $TUNNEL_PID"
            sleep 4
            echo "Recent Cloudflared Logs:"
            tail -n 20 tunnel.log || true
          fi

      - name: ⏳ Keep Server Active, Detect New Runs & Periodic MySQL Backup
        env:
          INPUT_HOURS: ${{ github.event.inputs.duration_hours || '5' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CUR_RUN_ID: ${{ github.run_id }}
          CUR_RUN_NUMBER: ${{ github.run_number }}
          CUR_REPOSITORY: ${{ github.repository }}
        run: |
          DURATION_HOURS=${INPUT_HOURS:-5}
          TOTAL_SECONDS=$((DURATION_HOURS * 3600))
          
          echo "=========================================================="
          echo "🟢 Server, GitHub MySQL & Cloudflare Tunnel are LIVE!"
          echo "⏱️ Target duration: $DURATION_HOURS hour(s) ($TOTAL_SECONDS seconds)"
          echo "💾 Periodic MySQL backup enabled (Every 60s)."
          echo "👀 Continuous New Run Detection enabled (Every 6s)."
          echo "=========================================================="
          
          START_TIME=$(date +%s)
          LAST_BACKUP=$(date +%s)
          
          dump_and_sync_db() {
            mkdir -p db_backup
            TMP_DUMP="db_backup/garmentflow_pro.tmp.sql"
            FINAL_DUMP="db_backup/garmentflow_pro.sql"
            
            if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then
              mysqldump -h 127.0.0.1 -P 3306 -u root -proot \
                --single-transaction \
                --quick \
                --triggers \
                --routines \
                --databases garmentflow_pro > "$TMP_DUMP" 2>/dev/null || true
                
              if [ -s "$TMP_DUMP" ]; then
                mv "$TMP_DUMP" "$FINAL_DUMP"
              else
                rm -f "$TMP_DUMP"
              fi
            fi
            
            # Push to Git db-storage branch so data is permanently persisted
            if [ -f "$FINAL_DUMP" ] && [ -s "$FINAL_DUMP" ]; then
              rm -rf /tmp/db_sync_wt
              git worktree add -B db-storage /tmp/db_sync_wt origin/db-storage 2>/dev/null || git worktree add -B db-storage /tmp/db_sync_wt 2>/dev/null || true
              if [ -d /tmp/db_sync_wt ]; then
                mkdir -p /tmp/db_sync_wt/db_backup
                cp "$FINAL_DUMP" /tmp/db_sync_wt/db_backup/garmentflow_pro.sql
                (
                  cd /tmp/db_sync_wt
                  git config user.name "GarmentFlow Backup Bot"
                  git config user.email "backup@garmentflow.erp"
                  git add db_backup/garmentflow_pro.sql
                  if ! git diff --cached --quiet; then
                    git commit -m "Auto-persist MySQL DB snapshot $(date -u '+%Y-%m-%d %H:%M:%S UTC') [skip ci]"
                    git push -f origin db-storage 2>/dev/null || true
                    echo "💾 Database backed up to Git 'db-storage' branch!"
                  fi
                )
                rm -rf /tmp/db_sync_wt
                git worktree prune 2>/dev/null || true
              fi
            fi
          }
          
          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            REMAINING=$((TOTAL_SECONDS - ELAPSED))
            
            if [ $REMAINING -le 0 ]; then
              echo "✅ Completed target duration of $DURATION_HOURS hour(s)."
              break
            fi
            
            # 1. Continuous New Run Detector: Checks if a newer workflow run has been triggered
            NEW_RUN_SIGNAL=$(python3 -c '
            import os, sys, json, urllib.request

            repo = os.environ.get("CUR_REPOSITORY") or os.environ.get("GITHUB_REPOSITORY", "")
            token = os.environ.get("GITHUB_TOKEN", "")
            cur_id = int(os.environ.get("CUR_RUN_ID") or os.environ.get("GITHUB_RUN_ID", "0"))
            cur_num = int(os.environ.get("CUR_RUN_NUMBER") or os.environ.get("GITHUB_RUN_NUMBER", "0"))
            active_statuses = ("queued", "in_progress", "waiting", "pending", "requested")

            if token and repo:
                try:
                    req = urllib.request.Request(
                        f"https://api.github.com/repos/{repo}/actions/runs?per_page=30",
                        headers={
                            "Authorization": f"Bearer {token}",
                            "Accept": "application/vnd.github.v3+json",
                            "User-Agent": "GarmentFlow-Detector"
                        }
                    )
                    with urllib.request.urlopen(req, timeout=6) as r:
                        runs = json.loads(r.read().decode()).get("workflow_runs", [])
                        newer = [
                            x for x in runs
                            if x.get("status") in active_statuses
                            and x.get("id") != cur_id
                            and (x.get("id", 0) > cur_id or x.get("run_number", 0) > cur_num)
                        ]
                        if newer:
                            first = newer[0]
                            run_id = first.get("id", "")
                            st = first.get("status", "")
                            print(f"{run_id} ({st})")
                except Exception:
                    pass
            ' 2>/dev/null || echo "")

            if [ -n "$NEW_RUN_SIGNAL" ]; then
              echo "=========================================================="
              echo "🚨 NEW WORKFLOW RUN DETECTED (#$NEW_RUN_SIGNAL)!"
              echo "📦 Taking atomic snapshot & syncing to Git 'db-storage'..."
              echo "=========================================================="
              dump_and_sync_db
              echo "✅ Snapshot ready: $(ls -lh db_backup/garmentflow_pro.sql)"
              echo "👋 Gracefully stopping server to yield to new workflow run..."
              break
            fi

            # 2. Periodic background dump and Git push every 90 seconds
            TIME_SINCE_BACKUP=$((CURRENT_TIME - LAST_BACKUP))
            if [ $TIME_SINCE_BACKUP -ge 90 ]; then
              dump_and_sync_db
              LAST_BACKUP=$CURRENT_TIME
              ELAPSED_MIN=$((ELAPSED / 60))
              REMAINING_MIN=$((REMAINING / 60))
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/login || echo "FAIL")
              echo "💓 Monitor: [Elapsed: ${ELAPSED_MIN}m / Rem: ${REMAINING_MIN}m] | Web: $STATUS | DB Sync: OK"
            fi

            sleep 6
          done

      # ================= SAFE DATA CACHE & TEARDOWN ON TIMEOUT, CANCEL OR NEW RUN HANDOFF =================

      - name: 🏷️ Generate Timestamped Cache Key
        if: always()
        run: |
          echo "TIMESTAMP_KEY=garmentflow-mysql-${{ github.run_number }}-$(date +%s)" >> $GITHUB_ENV

      - name: 💾 Dump & Persist MySQL Database to Git 'db-storage' (Runs on Success, Cancel, Timeout)
        if: always()
        run: |
          echo "=========================================================="
          echo "💾 FINAL MYSQL DATABASE EXPORT FOR GIT & CACHE STORAGE   "
          echo "=========================================================="
          mkdir -p db_backup
          TMP_DUMP="db_backup/garmentflow_pro.tmp.sql"
          FINAL_DUMP="db_backup/garmentflow_pro.sql"
          
          if mysqladmin ping -h 127.0.0.1 -P 3306 -u root -proot --silent; then
            echo "Dumping MySQL database 'garmentflow_pro'..."
            mysqldump -h 127.0.0.1 -P 3306 -u root -proot \
              --single-transaction \
              --quick \
              --triggers \
              --routines \
              --databases garmentflow_pro > "$TMP_DUMP" 2>/dev/null || true
            if [ -s "$TMP_DUMP" ]; then
              mv "$TMP_DUMP" "$FINAL_DUMP"
              echo "✅ Export complete: $(ls -lh "$FINAL_DUMP")"
            else
              rm -f "$TMP_DUMP"
            fi
          else
            echo "⚠️ MySQL service not responding or down, using latest backup."
            ls -lh "$FINAL_DUMP" || true
          fi
          
          # Git Push to db-storage branch so data is permanently persisted
          if [ -f "$FINAL_DUMP" ] && [ -s "$FINAL_DUMP" ]; then
            echo "Pushing final snapshot to Git 'db-storage' branch..."
            rm -rf /tmp/db_sync_wt
            git worktree add -B db-storage /tmp/db_sync_wt origin/db-storage 2>/dev/null || git worktree add -B db-storage /tmp/db_sync_wt 2>/dev/null || true
            if [ -d /tmp/db_sync_wt ]; then
              mkdir -p /tmp/db_sync_wt/db_backup
              cp "$FINAL_DUMP" /tmp/db_sync_wt/db_backup/garmentflow_pro.sql
              (
                cd /tmp/db_sync_wt
                git config user.name "GarmentFlow Backup Bot"
                git config user.email "backup@garmentflow.erp"
                git add db_backup/garmentflow_pro.sql
                if ! git diff --cached --quiet; then
                  git commit -m "Final DB snapshot $(date -u '+%Y-%m-%d %H:%M:%S UTC') [skip ci]"
                  git push -f origin db-storage 2>/dev/null || true
                  echo "✅ Final database successfully pushed to Git 'db-storage' branch!"
                else
                  echo "ℹ️ Database unchanged in final check."
                fi
              )
              rm -rf /tmp/db_sync_wt
              git worktree prune 2>/dev/null || true
            fi
          fi

      - name: 📦 Save MySQL Cache to Actions Cache (Runs on Success, Cancel, Timeout)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: db_backup
          key: ${{ env.TIMESTAMP_KEY || format('garmentflow-mysql-{0}-{1}', github.run_number, github.run_attempt) }}

      - name: 🧹 Graceful Server & Tunnel Teardown
        if: always()
        run: |
          echo "Shutting down server and tunnel..."
          pkill -f cloudflared || true
          pkill -f gunicorn || true
          echo "Teardown complete. All database data safely persisted for next run!"
