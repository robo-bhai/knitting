{% extends "base.html" %}
{% block title %}Edit Work Order | TexFlow ERP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-xs space-y-4">
  <div class="pb-3 border-b border-slate-200">
    <span class="text-[10px] font-mono uppercase px-2 py-0.5 rounded bg-emerald-50 text-emerald-800 font-bold border border-emerald-200">Work Order Edit</span>
    <h1 class="text-base font-bold text-slate-900 mt-2">Modify Work Order Code</h1>
    <p class="text-xs text-slate-500">Update work order name or identifier across production records.</p>
  </div>

  <form method="POST" action="{{ url_for('edit_work_order', id=wo['id']) }}" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Work Order Name / Code *</label>
      <input type="text" name="work_order" value="{{ wo['work_order'] }}" required
        class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-mono uppercase focus:ring-2 focus:ring-emerald-500 focus:outline-hidden">
    </div>

    <div class="flex items-center justify-end gap-2 pt-2">
      <a href="{{ url_for('ppc') }}" class="px-3 py-2 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-100">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-bold uppercase tracking-wider">
        Save Changes
      </button>
    </div>
  </form>
</div>
{% endblock %}
