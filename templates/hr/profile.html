{% extends "base.html" %}
{% block title %}Personnel Profile: {{ s['name'] }} | TexFlow ERP{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
  <div class="flex justify-between items-center mb-4 pb-3 border-b">
    <div>
      <span class="text-[10px] uppercase font-mono px-2 py-0.5 rounded bg-slate-100 font-bold">{{ s['emp_code'] }}</span>
      <h1 class="text-lg font-bold text-slate-900 mt-1">Personnel Dossier: {{ s['name'] }}</h1>
    </div>
    <a href="{{ url_for('hr_staff_directory') }}" class="text-xs text-slate-500 hover:underline">&larr; Back to Directory</a>
  </div>

  <form method="POST" enctype="multipart/form-data" action="{{ url_for('hr_profile', staff_id=s['id']) }}" class="space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Full Name *</label>
        <input type="text" name="name" value="{{ s['name'] }}" required class="w-full px-3 py-2 border rounded-lg text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Phone Number *</label>
        <input type="text" name="phone" value="{{ s['phone'] }}" required class="w-full px-3 py-2 border rounded-lg text-xs font-mono">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1">Residential Address</label>
      <input type="text" name="address" value="{{ s['address'] or '' }}" class="w-full px-3 py-2 border rounded-lg text-xs">
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Emergency Contact Person</label>
        <input type="text" name="e_name" value="{{ s['emergency_name'] or '' }}" class="w-full px-3 py-2 border rounded-lg text-xs">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Emergency Contact Phone</label>
        <input type="text" name="e_phone" value="{{ s['emergency_phone'] or '' }}" class="w-full px-3 py-2 border rounded-lg text-xs font-mono">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Monthly Salary (Rs.) *</label>
        <input type="number" name="salary" value="{{ s['salary'] }}" required class="w-full px-3 py-2 border rounded-lg text-xs font-mono font-bold">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Joining Form Document (Upload)</label>
        <input type="file" name="joining_form" class="w-full text-xs text-slate-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-100 file:text-xs">
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-3 border-t">
      <a href="{{ url_for('hr_staff_directory') }}" class="px-4 py-2 text-xs text-slate-600 hover:bg-slate-100 rounded">Cancel</a>
      <button type="submit" class="px-5 py-2 bg-slate-900 text-white rounded text-xs font-semibold">
        Update Personnel File
      </button>
    </div>
  </form>
</div>
{% endblock %}
