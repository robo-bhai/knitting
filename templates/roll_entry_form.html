{% extends "base.html" %}
{% block title %}Roll Entry Form | TexFlow ERP{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
  <h1 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b">Feed Fabric Roll (/roll-entry/form)</h1>

  <form method="POST" action="{{ url_for('roll_entry_form') }}" class="space-y-4">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Work Order</label>
        <input type="text" name="work_order" required class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Plan ID</label>
        <input type="text" name="plan_id" required class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Bag Number</label>
        <input type="text" name="bag" required class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Lot Name</label>
        <input type="text" name="lot" required class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Lot Needles</label>
        <input type="text" name="needles" required placeholder="e.g. 24N" class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Barcode Needles</label>
        <input type="text" name="barcode_needles" required placeholder="e.g. 24N" class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Roll Weight (KG) *</label>
        <input type="number" step="0.01" name="weight" required placeholder="22.50" class="w-full px-3 py-2 border rounded-lg text-xs font-mono font-bold">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Tube No</label>
        <input type="text" name="tube" value="T-101" class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
      </div>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ url_for('roll_entry') }}" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">Back</a>
      <button type="submit" class="px-5 py-2 bg-slate-900 text-white rounded text-xs font-bold uppercase">
        Save Roll
      </button>
    </div>
  </form>
</div>
{% endblock %}
