{% extends "base.html" %}
{% block title %}{{ title }} | TexFlow ERP{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
  <h1 class="text-base font-bold text-slate-900 mb-4 pb-2 border-b">{{ title }}</h1>
  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-700 mb-1 capitalize">{{ name.replace('_', ' ') }}</label>
      <input type="text" name="{{ name }}" value="{{ value }}" required class="w-full px-3 py-2 border rounded-lg text-xs font-mono uppercase">
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <a href="{{ url_for('ppc') }}" class="px-3 py-1.5 text-xs text-slate-600 hover:bg-slate-100 rounded">Cancel</a>
      <button type="submit" class="px-4 py-1.5 bg-slate-900 text-white rounded text-xs font-semibold">Save Changes</button>
    </div>
  </form>
</div>
{% endblock %}
